<body>
  <header class="site-header">

      <a class="brand" href="/">ZeroDoc</a>
      <nav id="menu" class="menu" hidden></nav>
      <div id="theme-slot" class="ml-auto"></div>
    </div>
  </header>

  <main class="page page-wide stack">
    <h1>Cola de moderación</h1>
    <p class="notice">Acá solo ves el ID, el motivo y el comentario de quien reporta. Nunca el contenido del paste ni su enlace: moderar consiste en descartar el reporte o destruir el paste a partir de su ID.</p>

    <p id="status" role="status" hidden></p>
    <p id="error" role="alert" hidden></p>
    <p id="empty" class="text-muted" hidden>No hay reportes abiertos.</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Paste</th><th>Motivo</th><th>Comentario</th><th>Fecha</th><th>Reportes del paste</th><th>Acciones</th></tr>
        </thead>
        <tbody id="reports"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="/assets/dist/moderation.js?v=51e4dee10099" integrity="sha384-/2EuRDQjzaU0AutbmKrobHPdPjoUYoxlXE9jNgAmLfPaYSwD642x8QzO0IUZDiW4"></script>
