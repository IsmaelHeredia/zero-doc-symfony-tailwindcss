name: zk-pastebin

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zk_pastebin
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: ./docker
      dockerfile: php/Dockerfile
      args:
        TAILWIND_VERSION: ${TAILWIND_VERSION:-v4.1.4}
        ESBUILD_VERSION: ${ESBUILD_VERSION:-0.25.0}
    image: zk-pastebin-app:dev
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://app:app@database:3306/zk_pastebin?serverVersion=8.4.0&charset=utf8mb4"
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - .:/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db_data: