framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: strict
    rate_limiter:
        abuse_report:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
            cookie_secure: false
            cookie_samesite: lax